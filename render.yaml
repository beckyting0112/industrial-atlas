services:
  - type: web
    name: industrial-supply-chain-atlas
    runtime: node
    plan: free
    repo: https://github.com/beckyting0112/industrial-atlas
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: NODE_ENV
        value: production
