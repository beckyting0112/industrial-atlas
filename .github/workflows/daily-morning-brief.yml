name: Refresh Morning Brief

on:
  schedule:
    # 12:00 UTC = 8:00 a.m. New York during daylight saving time.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-morning-brief
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pull and rank morning news
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if npm run news:pull; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "News discovery attempt $attempt failed; retrying in 20 seconds."
              sleep 20
            fi
          done
          echo "Morning Brief refresh failed after three attempts."
          exit 1
      - name: Verify site and data snapshot
        run: npm run deploy:check
      - name: Commit refreshed SQLite snapshot
        shell: bash
        run: |
          git config user.name "industrial-atlas-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/atlas.sqlite
          if git diff --cached --quiet; then
            echo "No morning-news changes to commit."
            exit 0
          fi
          git commit -m "data: refresh morning brief $(date -u +%F)"
          git push origin HEAD:main
      - name: Trigger Render deployment
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::warning::RENDER_DEPLOY_HOOK_URL is not configured; GitHub data refreshed but Render was not explicitly redeployed."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"
          echo "Render deployment requested."
